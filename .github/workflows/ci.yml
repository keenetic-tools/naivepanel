name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned by commit SHA (Task 16): a moved tag must not
      # silently change what runs in CI. The comment records the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python syntax (ast.parse)
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for path in sorted(Path(".").rglob("*.py")):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Tests
        run: python -m pytest -q

  lint:
    name: lint and scanners
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Bandit (medium+ severity)
        run: bandit -q -ll -r naivepanel.py panel
      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null 2>&1 \
            || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --version
          shellcheck install.sh S99naiveproxy S99naivepanel docker-e2e.sh

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      # Blocking on purpose (Task 16): vulnerabilities in the shipped runtime
      # surface fail the build. Exceptions, if ever needed, must name the CVE
      # and carry an expiry in this file — never a blanket continue-on-error.
      - name: pip-audit (runtime pins, strict)
        run: pip-audit -r requirements-runtime.txt --strict
