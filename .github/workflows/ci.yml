name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax (ast.parse)
        run: python3 -c "import ast; ast.parse(open('naivepanel.py').read())"
      - name: Shell syntax (sh -n)
        run: sh -n S99naiveproxy && sh -n S99naivepanel && sh -n install.sh
      - name: Python tests
        run: pip install flask bcrypt pytest && pytest -q
      - name: Lint (ruff)
        run: pip install ruff && ruff check naivepanel.py tests/
      - name: Security (bandit)
        run: pip install bandit && bandit -q -ll -r naivepanel.py
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: pip install pip-audit && pip-audit
